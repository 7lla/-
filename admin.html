<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>لوحة المشرف - تتبع السيارات</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2i-Bw6V-4DCpzdEMetj1ruqGPJ6Ludwk",
      authDomain: "dddd-6d2b7.firebaseapp.com",
      databaseURL: "https://dddd-6d2b7-default-rtdb.firebaseio.com",
      projectId: "dddd-6d2b7",
      storageBucket: "dddd-6d2b7.firebasestorage.app",
      messagingSenderId: "470385998919",
      appId: "1:470385998919:web:8412232af0f70f991d8562"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const map = L.map('map').setView([26.4, 50.1], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const markers = {};

    onValue(ref(database, 'drivers'), (snapshot) => {
      const data = snapshot.val();
      for (const plate in data) {
        const driver = data[plate];
        const latlng = [driver.lat, driver.lng];
        const content = `
          <b>${driver.name}</b><br>
          اللوحة: ${driver.plate}<br>
          المشروع: ${driver.project}<br>
          آخر تحديث: ${new Date(driver.time).toLocaleString()}
        `;

        if (markers[plate]) {
          markers[plate].setLatLng(latlng).setPopupContent(content);
        } else {
          markers[plate] = L.marker(latlng).addTo(map).bindPopup(content);
        }
      }
    });
  </script>
</body>
</html>
